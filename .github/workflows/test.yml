name: Tests

# Unlike build-release.yml, which only fires on a tag, this runs on every push so
# a regression is caught when it lands rather than when a release is cut.
on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Tk and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk8.6 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generator tests
        # Stdlib unittest, so these need nothing installed to run locally either.
        run: python -m unittest discover -s tests -v

      - name: Desktop app smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python gui_smoke_test.py

      - name: Desktop app smoke test (Windows)
        if: runner.os == 'Windows'
        run: python gui_smoke_test.py

      - name: CLI still runs end to end
        run: |
          python dcc_mapgen.py --floor 1 --size small --seed 1 --out cli_check.md
          python dcc_mapgen.py --floor 9 --size medium --seed 1 --save cli_check_dir

  # The mobile web page runs the same generator in the browser through Pyodide.
  # pages.yml repeats these before it publishes; here they catch a break on the
  # push that causes it, not at release time.
  web:
    name: web page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Pyodide, Playwright and axe-core
        run: |
          npm install --no-save "pyodide@$(node -p "require('./web/versions.json').pyodide")" playwright@1.64.1 axe-core@4.13.0
          npx playwright install --with-deps chromium

      - name: The generator gives the same floors in Pyodide
        run: node web/check_pyodide.mjs

      - name: Build the site
        run: python web/build_site.py _site

      - name: The page works in a phone-sized browser, online and off, and passes the accessibility checks
        run: node web/smoke_test.mjs _site
